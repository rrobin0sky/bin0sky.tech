<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Sky Blue (APPS) -->
    <linearGradient id="fav-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="fav-sky-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Coral Rose (NOTES) -->
    <linearGradient id="fav-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="fav-rose-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>

    <!-- Mint Emerald (LABS) -->
    <linearGradient id="fav-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="fav-emerald-d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>

  <!-- Apple Dark Squircle Canvas -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#12141a" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Three-Color Spiral Pinwheel Geometry -->
  <g transform="translate(32,32)">
    <!-- Blade 1: Sky (APPS) -->
    <g>
      <path d="M 0,0 C 0,-10 3,-18 0,-22 C 8,-21 16,-17 20,-11 Z" fill="url(#fav-sky)"/>
      <path d="M 0,0 L 20,-11 C 18,-6 14,-1 8,0 Z" fill="url(#fav-sky-d)"/>
    </g>

    <!-- Blade 2: Rose (NOTES) -->
    <g transform="rotate(120)">
      <path d="M 0,0 C 0,-10 3,-18 0,-22 C 8,-21 16,-17 20,-11 Z" fill="url(#fav-rose)"/>
      <path d="M 0,0 L 20,-11 C 18,-6 14,-1 8,0 Z" fill="url(#fav-rose-d)"/>
    </g>

    <!-- Blade 3: Emerald (LABS) -->
    <g transform="rotate(240)">
      <path d="M 0,0 C 0,-10 3,-18 0,-22 C 8,-21 16,-17 20,-11 Z" fill="url(#fav-emerald)"/>
      <path d="M 0,0 L 20,-11 C 18,-6 14,-1 8,0 Z" fill="url(#fav-emerald-d)"/>
    </g>

    <!-- Center Hub Pin -->
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.8" fill="#12141a"/>
  </g>
</svg>
